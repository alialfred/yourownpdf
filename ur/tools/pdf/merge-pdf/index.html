wser RAM."}},{"@type":"Question","name":"Are my confidential documents uploaded to an online server during merging?","acceptedAnswer":{"@type":"Answer","text":"No, absolutely not. All merging computation happens 100% locally inside your web browser using HTML5 & WebAssembly. Your sensitive tax forms, bank statements, or legal contracts never leave your device."}},{"@type":"Question","name":"How does drag-and-drop page reordering work before merging?","acceptedAnswer":{"@type":"Answer","text":"Once you upload your files, visual cards appear for each file. Simply click and drag any card to shift its position. For instance, drag \"Appendix.pdf\" to the end of the list before clicking Merge."}},{"@type":"Question","name":"Will merging alter the vector quality or crispness of text fonts?","acceptedAnswer":{"@type":"Answer","text":"No. Vector fonts, high-resolution logos, and text formatting remain 100% untouched. Pages are stitched together losslessly without re-compressing vector assets."}},{"@type":"Question","name":"Can I merge password-protected PDF files?","acceptedAnswer":{"@type":"Answer","text":"Yes, provided you know the password. If an uploaded PDF is encrypted, a password prompt will pop up asking for the password so it can be decrypted in memory before merging."}},{"@type":"Question","name":"How fast is the PDF merging process on large multi-page documents?","acceptedAnswer":{"@type":"Answer","text":"Because the operation executes using your computer or smartphone CPU, merging 50 pages takes less than 2 seconds, eliminating server latency completely."}},{"@type":"Question","name":"Can I merge landscape and portrait pages together in the same PDF?","acceptedAnswer":{"@type":"Answer","text":"Yes! Pages maintain their original orientations (e.g., combining a portrait legal agreement with a wide landscape Excel spreadsheet chart)."}},{"@type":"Question","name":"Does YourOwnPDF add any promotional watermarks to merged PDFs?","acceptedAnswer":{"@type":"Answer","tex
